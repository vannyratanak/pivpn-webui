name: Deploy

on:
  workflow_dispatch:   # manual trigger only — nothing touches the server automatically

jobs:
  deploy:
    # self-hosted, not ubuntu-latest: GitHub's cloud runners can't reach
    # the deploy targets at all (private-network addresses, confirmed by
    # a real connection timeout when this ran on ubuntu-latest) — this
    # has to run from a machine that's already on the same network as
    # the servers.
    runs-on: [self-hosted, macos]
    steps:
      - name: Write deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy to target 1
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_TARGET_1 }} "ignored, server runs a forced command"
      - name: Deploy to target 2
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_TARGET_2 }} "ignored, server runs a forced command"
