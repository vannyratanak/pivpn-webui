name: CI

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: SECRET_KEY=ci ADMIN_PASSWORD_HASH=ci python -c "from app import create_app; create_app()"
