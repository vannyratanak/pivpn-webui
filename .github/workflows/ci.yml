name: CI

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: pivpn_webui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-for-isolated-test-database
      ADMIN_PASSWORD_HASH: ci
      PIVPN_WEBUI_DB_HOST: localhost
      PIVPN_WEBUI_DB_NAME: pivpn_webui_test
      PIVPN_WEBUI_DB_USER: postgres
      PIVPN_WEBUI_DB_PASSWORD: test-password
      TEST_DB_NAME: pivpn_webui_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt pytest
      - run: SECRET_KEY=ci ADMIN_PASSWORD_HASH=ci python -c "from app import create_app; create_app()"
      - run: pytest tests/ -v
      - run: node --test tests/js/*.test.cjs
